spring.application.name=RyokanMaker

#oracle 21C 이하
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//3.36.211.118:2200/XEPDB1
spring.datasource.username=ryokan
spring.datasource.password=ryokan123

# mapper.xml 위치 설정 : resources 폴더에서 mappers 폴더를 생성
mybatis.mapper-locations=classpath:/mappers/**/*.xml

# DB 컬럼명(예: ADMIN_ID)을 DTO 필드명(예: adminId)으로 자동 매핑
# 이 설정이 없으면 MyBatis가 언더스코어 컬럼명과 카멜케이스 필드명을 다른 것으로 인식해서
# resultType으로 지정한 DTO에 값이 안 채워짐 (null로 들어옴)
mybatis.configuration.map-underscore-to-camel-case=true

# 이미지 업로드 용량 제한 (기본값 1MB라 사진 업로드 시 너무 작음 -> 넉넉하게 올림)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
