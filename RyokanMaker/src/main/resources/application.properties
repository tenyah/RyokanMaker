spring.application.name=RyokanMaker

#oracle 21C 이하
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@3.36.211.118:2200/XEPDB1
spring.datasource.username=ryokan
spring.datasource.password=ryokan123

# mapper.xml 위치 설정 : resources 폴더에서 mappers 폴더를 생성
mybatis.mapper-locations=classpath:/mappers/**/*.xml

# DB 컬럼명(예: ADMIN_ID)을 DTO 필드명(예: adminId)으로 자동 매핑
# 이 설정이 없으면 MyBatis가 언더스코어 컬럼명과 카멜케이스 필드명을 다른 것으로 인식해서
# resultType으로 지정한 DTO에 값이 안 채워짐 (null로 들어옴)
mybatis.configuration.map-underscore-to-camel-case=true

# TossPayments (문서용 테스트 키)
tosspayments.client-key=test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm
tosspayments.secret-key=test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6

# 메일 발송 (관리자 계정 승인 시 아이디/비밀번호 발송용)
# 계정 정보는 커밋하지 말고 각자 로컬 환경변수(MAIL_USERNAME/MAIL_PASSWORD)로 설정하세요.
# 설정하지 않으면 메일 발송 기능만 비활성화되고 앱은 정상 기동됩니다.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini 번역 (공지사항 등 관리자 콘텐츠를 EN/JA로 즉석 번역)
# 키는 커밋하지 말고 로컬 환경변수 GEMINI_API_KEY로 설정하세요.
# 설정하지 않으면 번역 없이 원문(한국어)만 표시됩니다.
gemini.api.key=${GEMINI_API_KEY:}

# 이미지 업로드 용량 제한 (기본값 1MB라 사진 업로드 시 너무 작음 -> 넉넉하게 올림)
# max-file-size : 파일 1개당 최대 크기
# max-request-size : 요청 전체(로고 1장 + 메인이미지 최대 10장 등 동시 업로드분 합산) 최대 크기
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Tomcat 자체의 요청 크기 제한 (multipart 설정과 별도로 존재 - 이것도 같이 올려야 413이 안 남)
server.tomcat.max-swallow-size=100MB
