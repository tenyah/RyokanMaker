# Gemini 번역 (공지사항 등 관리자 콘텐츠를 EN/JA로 즉석 번역)
# 키는 커밋하지 말고 로컬 환경변수 GEMINI_API_KEY로 설정하세요.
# 설정하지 않으면 번역 없이 원문 그대로 표시됩니다.
gemini.api.key=${GEMINI_API_KEY:}
# 번역 모델: 쉼표로 여러 개를 적으면 앞에서부터 시도하고 실패(과부하/폐기)하면 다음 모델로 넘어갑니다.
# (2.5 계열은 이미 신규 사용자에게 폐기됨. 기본값이면 충분하니 바꿔야 할 때만 GEMINI_MODELS 환경변수로 덮어쓰세요)
gemini.models=${GEMINI_MODELS:gemini-flash-lite-latest,gemini-3.1-flash-lite,gemini-flash-latest}

# 다국어: messages_ko 파일이 없으므로 한국어는 messages.properties를 쓰게 하고, 서버 OS 언어로 새지 않게 함
spring.messages.fallback-to-system-locale=false

# 관리자 계정 신청이 새로 들어왔을 때 알림 메일을 받을 주소
admin.notify.email=june47087@gmail.com

# 이미지 업로드 용량 제한 (기본값 1MB라 사진 업로드 시 너무 작음 -> 넉넉하게 올림)
# max-file-size : 파일 1개당 최대 크기
# max-request-size : 요청 전체(로고 1장 + 메인이미지 최대 10장 등 동시 업로드분 합산) 최대 크기
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Tomcat 자체의 요청 크기 제한 (multipart 설정과 별도로 존재 - 이것도 같이 올려야 413이 안 남)
server.tomcat.max-swallow-size=100MB

# 관리자 메일 앱 비밀번호를 DB에 암호화해서 저장할 때 쓰는 키 (아무 긴 문자열). 코드/DB에 두지 말고 서버 환경변수 MAIL_SECRET_KEY로만 설정하세요.
# 설정하지 않으면 관리자 메일 앱 비밀번호를 저장할 수 없고, 플랫폼 공용 메일 계정으로만 발송됩니다.
mail.secret.key=${MAIL_SECRET_KEY:}
