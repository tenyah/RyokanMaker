<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지사항 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='notice')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 공지사항</div>
    <h1>공지사항</h1>
    <div class="rule"></div>
    <p class="desc">清流庵 이용 안내 및 임시 휴업, 운영 변경 등의 소식을 전해드립니다.</p>
  </section>

  <section class="board-list">
    <a class="board-row" th:each="notice : ${noticeList}"
       th:href="@{/notice/view(idx=${notice.noticeIdx})}">
      <span class="board-date" th:text="${#temporals.format(notice.noticeCreatedAt, 'yyyy.MM.dd')}">2026.01.01</span>
      <span class="board-title" th:text="${notice.noticeTitle}">공지 제목</span>
    </a>

    <div class="board-empty" th:if="${#lists.isEmpty(noticeList)}">
      등록된 공지사항이 없습니다.
    </div>
  </section>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
