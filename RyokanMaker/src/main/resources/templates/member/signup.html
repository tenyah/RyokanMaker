<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='signup')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 회원가입</div>
    <h1>회원가입</h1>
    <div class="rule"></div>
    <p class="desc">숙박 예약과 문의 이용을 위해 회원가입을 해주세요.</p>
  </section>

  <div th:if="${error}" class="form-card" style="padding-bottom:0;">
    <div class="answer-block">
      <div class="answer-body" th:text="${error}" style="color:var(--warn);"></div>
    </div>
  </div>

  <form class="form-card" th:action="@{/member/signup}" method="post">

    <div class="form-row">
      <label class="field-label">이메일 (아이디)</label>
      <input type="text" name="userMail" th:value="${member?.userMail}" placeholder="you@example.com" required>
    </div>

    <div class="form-row">
      <label class="field-label">비밀번호</label>
      <input type="password" name="userPassword" placeholder="비밀번호" required>
    </div>

    <div class="form-row">
      <label class="field-label">닉네임</label>
      <input type="text" name="userNickname" th:value="${member?.userNickname}" placeholder="닉네임" required>
    </div>

    <div class="form-row">
      <label class="field-label">국가</label>
      <select name="userCountry" required>
        <option value="">국가를 선택해주세요</option>
        <option th:each="c : ${countries}" th:value="${c}" th:text="${c}"></option>
      </select>
    </div>

    <div class="form-row">
      <label class="field-label">연락처 (국가번호는 위에서 선택한 국가에 맞춰 자동으로 붙습니다)</label>
      <input type="text" name="userTelLocal" placeholder="10-1234-5678" required>
    </div>

    <!-- 주소 : 아마존 가입 폼처럼 우편번호 + 기본주소 + 상세주소로 분리 -->
    <div class="form-row">
      <label class="field-label">우편번호</label>
      <input type="text" name="userPostalCode" placeholder="12345" style="max-width:200px;" required>
    </div>

    <div class="form-row">
      <label class="field-label">주소</label>
      <div class="row-2">
        <input type="text" name="userAddress1" placeholder="도로명 주소" required>
        <input type="text" name="userAddress2" placeholder="상세 주소 (건물명, 동/호수 등)" required>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-gold">가입하기</button>
    </div>
  </form>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
