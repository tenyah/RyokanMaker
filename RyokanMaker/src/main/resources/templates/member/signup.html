<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='signup')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 회원가입</div>
    <h1>회원가입</h1>
    <div class="rule"></div>
    <p class="desc">숙박 예약과 문의 이용을 위해 회원가입을 해주세요.</p>
  </section>

  <div th:if="${error}" class="form-card" style="padding-bottom:0;">
    <div class="answer-block">
      <div class="answer-body" th:text="${error}" style="color:var(--warn);"></div>
    </div>
  </div>

  <form class="form-card" th:action="@{/member/signup}" method="post">

    <div class="form-row">
      <label class="field-label">이메일 (아이디)</label>
      <input type="text" name="userMail" th:value="${member?.userMail}" placeholder="you@example.com" required>
    </div>

    <div class="form-row">
      <label class="field-label">비밀번호</label>
      <input type="password" name="userPassword" placeholder="비밀번호" required>
    </div>

    <div class="form-row">
      <label class="field-label">닉네임</label>
      <input type="text" name="userNickname" th:value="${member?.userNickname}" placeholder="닉네임" required>
    </div>

    <div class="form-row">
      <label class="field-label">주소 (선택)</label>
      <input type="text" name="userAddress" th:value="${member?.userAddress}" placeholder="주소">
    </div>

    <div class="form-row">
      <label class="field-label">국가 (선택)</label>
      <input type="text" name="userCountry" th:value="${member?.userCountry}" placeholder="대한민국">
    </div>

    <div class="form-row">
      <label class="field-label">연락처 (선택)</label>
      <input type="text" name="userTel" th:value="${member?.userTel}" placeholder="010-0000-0000">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-gold">가입하기</button>
    </div>
  </form>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
