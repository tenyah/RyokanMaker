<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{mypage.title} + ' | ' + (${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵')">마이페이지 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='mypage')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; <span th:text="#{mypage.title}">마이페이지</span></div>
    <h1 th:text="#{mypage.title}">마이페이지</h1>
    <div class="rule"></div>
    <p class="desc" th:text="#{mypage.desc}">회원 정보를 확인하고 수정할 수 있습니다.</p>
  </section>

  <div th:if="${message}" class="form-card" style="padding-bottom:0;">
    <div class="answer-block">
      <div class="answer-body" th:text="#{${message}}"></div>
    </div>
  </div>

  <section class="reservation-history">
    <h2 style="font-family: var(--serif); font-size: 18px; font-weight: 400; color: var(--ink); margin: 0 0 16px;" th:text="#{mypage.resv_heading}">예약 현황</h2>
    <table>
      <thead>
        <tr>
          <th th:text="#{resv.room}">객실</th>
          <th th:text="#{resv.plan}">플랜</th>
          <th th:text="#{resv.checkin}">체크인</th>
          <th th:text="#{resv.checkout}">체크아웃</th>
          <th th:text="#{resv.people}">인원</th>
          <th th:text="#{resv.amount}">금액</th>
          <th th:text="#{resv.status}">상태</th>
        </tr>
      </thead>
      <tbody th:with="_p=${@tr.prefetch(reservations, 'roomName', 'planName')}">
        <tr th:each="r : ${reservations}">
          <td th:text="${@tr.t(r.roomName)}">사쿠라</td>
          <td th:text="${@tr.t(r.planName)}">객실 + 식사 플랜</td>
          <td th:text="${#temporals.format(r.resvCheckIn, 'yyyy.MM.dd')}">2026.09.13</td>
          <td th:text="${#temporals.format(r.resvCheckOut, 'yyyy.MM.dd')}">2026.09.14</td>
          <td th:text="${r.resvPeople}">2</td>
          <td th:text="#{common.price(${#numbers.formatInteger(r.resvPrice, 0, 'COMMA')})}">848,508원</td>
          <td th:text="${@tr.label('resv.status', r.resvStatus)}">예약완료</td>
        </tr>
      </tbody>
    </table>
    <div class="reservation-history-empty" th:if="${#lists.isEmpty(reservations)}" th:text="#{mypage.resv_empty}">
      예약 내역이 없습니다.
    </div>
  </section>

  <div th:if="${error}" class="form-card" style="padding-bottom:0;">
    <div class="answer-block">
      <div class="answer-body" th:text="#{${error}}" style="color:var(--warn);"></div>
    </div>
  </div>

  <form class="form-card" th:action="@{/member/mypage}" method="post">

    <div class="form-row">
      <label class="field-label" th:text="#{member.email_id}">이메일 (아이디)</label>
      <input type="text" th:value="${member.userMail}" disabled>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.new_password}">새 비밀번호 (변경할 때만 입력)</label>
      <input type="password" name="newPassword" th:placeholder="#{member.new_password_ph}">
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.nickname}">닉네임</label>
      <input type="text" name="userNickname" th:value="${member.userNickname}" required>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.name_en}">영문 이름 (여권 표기 기준)</label>
      <div class="row-2">
        <input type="text" name="userLastNameEn" th:value="${member.userLastNameEn}" placeholder="Last Name"
               pattern="[A-Za-z][A-Za-z '\-]*" th:title="#{member.pattern_en}" required>
        <input type="text" name="userFirstNameEn" th:value="${member.userFirstNameEn}" placeholder="First Name"
               pattern="[A-Za-z][A-Za-z '\-]*" th:title="#{member.pattern_en}" required>
      </div>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.name_jp}">일본어 이름 (선택, 히라가나/가타카나만 - 한자 불가)</label>
      <div class="row-2">
        <input type="text" name="userLastNameJp" th:value="${member.userLastNameJp}" placeholder="せい"
               pattern="[぀-ゟ゠-ヿ]*" th:title="#{member.pattern_jp}">
        <input type="text" name="userFirstNameJp" th:value="${member.userFirstNameJp}" placeholder="めい"
               pattern="[぀-ゟ゠-ヿ]*" th:title="#{member.pattern_jp}">
      </div>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.country}">국가</label>
      <select name="userCountry" required th:with="_p=${@tr.prefetch(countries, 'countryName')}">
        <option value="" th:text="#{member.country_select}">국가를 선택해주세요</option>
        <option th:each="c : ${countries}" th:value="${c.countryName}" th:text="${@tr.t(c.countryName) + ' (' + c.dialCode + ')'}"
                th:selected="${c.countryName == member.userCountry}"></option>
      </select>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.tel}">연락처</label>
      <input type="text" name="userTel" th:value="${member.userTel}" required>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.address}">주소</label>
      <input type="text" name="userAddress" th:value="${member.userAddress}" required>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-gold" th:text="#{common.save}">저장</button>
    </div>
  </form>

  <div class="content-actions" style="padding-bottom: 64px;">
    <form th:action="@{/member/withdraw}" method="post"
          th:data-confirm="#{mypage.withdraw_confirm}" onsubmit="return confirm(this.dataset.confirm);">
      <button type="submit" class="btn-line" style="color:var(--warn); border-color:var(--warn);" th:text="#{mypage.withdraw}">회원탈퇴</button>
    </form>
  </div>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
