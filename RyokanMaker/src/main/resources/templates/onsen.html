<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'온천 안내 | ' + (${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵')">온천 안내 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <!-- 공통 헤더 include (현재 메뉴 = onsen) -->
  <div th:replace="~{include/header :: header(activePage='onsen')}"></div>

  <!-- 타이틀 -->
  <section class="page-title">
    <div class="crumb">Hot Spring &nbsp;/&nbsp; 温泉</div>
    <h1>온천 안내</h1>
    <div class="rule"></div>
  </section>

  <!--
    onsens는 DB의 ONSEN 테이블에서 조회한 OnsenDto 리스트입니다 (ONSEN_SALE_YN='Y'인 항목만).
    필드 : onsenName, onsenHour("시작–종료"), onsenInfo, onsenMemo, imageUrls(전체 이미지 경로 목록)
    사진은 가운데 캐러셀로, 그 아래 텍스트(온천명 → 이용시간 → 소개 → 비고)를 배치한다.
  -->
  <section class="detail-list">
    <div class="detail-item" th:each="onsen : ${onsens}">
      <div class="detail-thumb" data-carousel>
        <button type="button" class="nav-btn nav-prev" onclick="carouselMove(this, -1)" th:if="${#lists.size(onsen.imageUrls) > 1}">&#10094;</button>
        <div class="slide" th:if="${!#lists.isEmpty(onsen.imageUrls)}">
          <img th:each="url : ${onsen.imageUrls}" th:src="@{${url}}" alt="">
        </div>
        <th:block th:if="${#lists.isEmpty(onsen.imageUrls)}">
          <img th:src="@{/images/sample/onsen.svg}" alt="" class="sample-img">
          <span class="sample-badge">샘플 이미지</span>
        </th:block>
        <button type="button" class="nav-btn nav-next" onclick="carouselMove(this, 1)" th:if="${#lists.size(onsen.imageUrls) > 1}">&#10095;</button>
        <div class="dots" th:if="${#lists.size(onsen.imageUrls) > 1}">
          <span th:each="url, iter : ${onsen.imageUrls}" th:classappend="${iter.index == 0} ? 'active' : ''"></span>
        </div>
      </div>
      <div class="detail-body">
        <h2 th:text="${onsen.onsenName}">노천탕 (露天湯)</h2>
        <div class="meta-row" th:if="${onsen.onsenHour != null and !onsen.onsenHour.isEmpty()}">
          <span>이용 시간 <span th:text="${onsen.onsenHour}">15:00~22:00</span></span>
        </div>
        <p class="desc" th:text="${onsen.onsenInfo}">오타루 앞바다가 보이는 전세탕(대절) 노천탕</p>
        <p class="memo" th:if="${onsen.onsenMemo != null and !onsen.onsenMemo.isEmpty()}" th:text="${onsen.onsenMemo}">플랜을 통해 예약할 수 있으며 이용시간은 45분입니다</p>
      </div>
    </div>
    <div class="intro-empty" th:if="${#lists.isEmpty(onsens)}">등록된 온천 정보가 없습니다.</div>
  </section>

  <p style="text-align:center; font-size:12px; color:var(--ink-faint); margin:-32px 56px 64px;">
    ※ 전세탕은 숙박 예약 시 플랜에 포함된 경우에 한해 이용하실 수 있습니다.
  </p>

  <!-- 공통 푸터 include -->
  <div th:replace="~{include/footer :: footer}"></div>

</div>

<script th:src="@{/js/carousel.js}"></script>

</body>
</html>
