<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{pay.done_title} + ' | ' + (${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵')">예약 완료 | 清流庵 OTARU FURUKAWA</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='booking')}"></div>

  <div class="result-wrap">
    <span class="result-badge ok">✓</span>
    <h1 th:text="#{pay.done_heading}">예약이 확정되었습니다</h1>
    <p th:text="#{pay.done_desc}">결제가 정상적으로 완료되었습니다. 예약 확인 메일을 보내드렸습니다.</p>

    <div class="result-panel">
      <div class="result-row"><span class="k" th:text="#{pay.order_no}">주문번호</span><span class="v" th:text="${orderId}">RYOKAN-XXXX</span></div>
      <div class="result-row"><span class="k" th:text="#{pay.paid_amount}">결제금액</span><span class="v" th:text="'₩' + ${#numbers.formatInteger(amount, 0, 'COMMA')}">₩848,508</span></div>
      <div class="result-row"><span class="k" th:text="#{pay.paid_status}">결제상태</span><span class="v" th:text="${@tr.label('pay.status', result['status'])}">DONE</span></div>
    </div>

    <a class="result-action" th:href="@{/}" th:text="#{pay.back_main}">메인으로 돌아가기</a>
  </div>

</div>

<div th:replace="~{include/footer :: footer}"></div>

</body>
</html>
