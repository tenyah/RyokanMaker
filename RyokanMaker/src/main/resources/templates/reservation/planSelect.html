<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>플랜 선택 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <!-- 공통 헤더 include (현재 메뉴 = booking) -->
  <div th:replace="~{include/header :: header(activePage='booking')}"></div>

  <!-- 타이틀 -->
  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 숙박예약 &nbsp;/&nbsp; 플랜 선택</div>
    <h1>플랜을 선택해주세요</h1>
    <div class="rule"></div>
    <p class="desc">원하시는 구성으로 플랜을 골라주세요. 플랜 선택 후 예약 가능한 날짜와 요금을 확인하실 수 있습니다.</p>
  </section>

  <!--
    plans는 DB의 PLAN 테이블에서 조회한 PlanDTO 리스트입니다.
    필드 : planIdx, planName, planImage, planIncludesMeal(Y/N), planIncludesOnsen(Y/N), planInfo, planPrice
  -->
  <section class="plan-grid">

    <div class="plan-card" th:each="plan : ${plans}">
      <div class="thumb">
        <img th:src="@{${plan.planImage}}" alt="">
      </div>
      <div class="body">
       <!-- 식사/온천만 포함된 경우에만 표시 -->
        <div class="incl-row">
          <span class="incl on" th:if="${plan.planIncludesMeal == 'Y'}">식사</span>
          <span class="incl on" th:if="${plan.planIncludesOnsen == 'Y'}">온천</span>
        </div>
        <h3 th:text="${plan.planName}">플랜명</h3>
        <p th:text="${plan.planInfo}">플랜 설명</p>
        <div class="price-row">
          <div>
            <span class="from">1박 2인 기준</span>
            <span class="amount">
              <span th:text="${'₩' + #numbers.formatInteger(plan.planPrice, 0, 'COMMA')}">₩0</span>
              <span class="unit">부터</span>
            </span>
          </div>
         <a class="btn-gold" ... th:href="@{/reservation/reservation(planCode=${plan.planIdx})}">이 플랜으로 예약하기</a>
        </div>
      </div>
    </div>

  </section>

  <p style="text-align:center; font-size:12px; color:var(--ink-faint); margin:28px 56px 0;">
    ※ 표시된 요금과 구성은 화면 구성 예시이며, 실제 요금 및 포함 내역은 추후 확정됩니다.
  </p>

  <!-- 공통 푸터 include -->
  <div style="margin-top:56px;" th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
