<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="'清流庵 ' + #{adm.title_access}">清流庵 관리자 - 교통안내</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<!-- 아이콘 스프라이트 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 12.5h6M9 16h6"/>
    </symbol>
    <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="15.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>
    </symbol>
    <symbol id="i-bed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18v2M21 18v2"/>
      <path d="M3 13V8a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3"/><circle cx="7" cy="10" r="1"/>
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.5 3.5H20a.5.5 0 0 1 .5.5v7.5a1 1 0 0 1-.3.7l-8.8 8.8a1 1 0 0 1-1.4 0l-6.7-6.7a1 1 0 0 1 0-1.4l8.8-8.8a1 1 0 0 1 .4-.3Z"/>
      <circle cx="16" cy="8" r="1.3"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5.5" width="18" height="13"/><path d="m3.5 6 8.5 7 8.5-7"/>
    </symbol>
    <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/>
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="10.5" width="15" height="10" rx="1"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
    </symbol>
  </defs>
</svg>

<!-- 사이트 공통 헤더 -->
<div class="site-header">
  <div class="logo">
    <span class="kanji">清流庵</span>
    <span class="romaji">OTARU FURUKAWA &nbsp;·&nbsp; ADMIN</span>
  </div>
  <nav style="gap:40px;">
    <a class="navlink" href="#" th:text="#{adm.dashboard}">대시보드</a>
    <a class="navlink" th:href="@{/Admin/admin_info_register}" th:text="#{adm.info}">정보등록</a>
    <a class="navlink" th:href="@{/Admin/reservation_status}" th:text="#{adm.reservation}">예약 현황</a>
    <a class="navlink" th:href="@{/Admin/room_status}" th:text="#{adm.room}">객실 현황</a>
    <a class="navlink" th:href="@{/Admin/plan_sales}" th:text="#{adm.plan}">판매 관리</a>
    <a class="navlink" th:href="@{/Admin/admin_inquiry}" th:text="#{adm.inquiry}">문의 관리</a>
    <span class="navlink" style="display:inline-flex; gap:8px;"><a href="#" style="font-size:12px;" onclick="var u=new URL(location.href);u.searchParams.set('lang','ko');location.href=u;return false;">KO</a><a href="#" style="font-size:12px;" onclick="var u=new URL(location.href);u.searchParams.set('lang','en');location.href=u;return false;">EN</a><a href="#" style="font-size:12px;" onclick="var u=new URL(location.href);u.searchParams.set('lang','ja');location.href=u;return false;">JA</a></span>
    <span class="btn-line" style="padding:10px 20px;font-size:12px;gap:7px;"><svg width="14" height="14"><use href="#i-eye"/></svg>&nbsp;<span th:text="#{adm.view_site}">사이트 보기</span></span>
    <div class="account-menu" id="accountMenu">
      <button type="button" class="account-trigger" onclick="document.getElementById('accountMenu').classList.toggle('open')" th:text="#{adm.avatar}">관</button>
      <div class="account-dropdown">
        <div class="account-dropdown-head">
          <div class="avatar-sm" th:text="#{adm.avatar}">관</div>
          <div>
            <div class="name" th:text="'清流庵 ' + #{adm.admin}">清流庵 관리자</div>
            <div class="sub">ADMIN_ID</div>
          </div>
        </div>
        <a class="account-dropdown-item" th:href="@{/Admin/admin_pwreset}">
          <svg width="15" height="15"><use href="#i-lock"/></svg><span th:text="#{adm.change_pw}">비밀번호 변경</span>
        </a>
        <a class="account-dropdown-item danger" th:href="@{/Admin/admin_logout}">
          <svg width="15" height="15"><use href="#i-logout"/></svg><span th:text="#{nav.logout}">로그아웃</span>
        </a>
      </div>
    </div>
  </nav>
</div>

<div class="admin-shell">

  <!-- 사이드바 -->
  <aside class="admin-sidebar">
    <div class="menu-label" th:text="#{adm.menu}">관리자 메뉴</div>

    <div class="tenant-card">
      <div class="mark">淸</div>
      <div class="who">
        <div class="label" th:text="#{adm.managing}">관리 중인 여관</div>
        <div class="name" th:text="#{adm.ac_tenant}">清流庵 (오타루)</div>
      </div>
      <svg width="14" height="14" style="color:var(--ink-faint);flex:0 0 auto;"><use href="#i-chevron"/></svg>
    </div>

    <nav class="admin-nav">
      <a class="admin-nav-item" th:href="@{/Admin/admin_info_register}">
        <svg width="17" height="17"><use href="#i-doc"/></svg>
        <span th:text="#{adm.info}">정보등록</span>
      </a>
      <a class="admin-nav-item" th:href="@{/Admin/reservation_status}">
        <svg width="17" height="17"><use href="#i-cal"/></svg>
        <span th:text="#{adm.reservation}">예약 현황</span>
      </a>
      <a class="admin-nav-item" th:href="@{/Admin/room_status}">
        <svg width="17" height="17"><use href="#i-bed"/></svg>
        <span th:text="#{adm.room}">객실 현황</span>
      </a>
      <a class="admin-nav-item" th:href="@{/Admin/plan_sales}">
        <svg width="17" height="17"><use href="#i-tag"/></svg>
        <span th:text="#{adm.plan}">판매 관리</span>
      </a>
      <a class="admin-nav-item" th:href="@{/Admin/admin_inquiry}">
        <svg width="17" height="17"><use href="#i-mail"/></svg>
        <span th:text="#{adm.inquiry}">문의 관리</span>
      </a>
      <a class="admin-nav-item active" th:href="@{/Admin/access_edit}">
        <svg width="17" height="17"><use href="#i-map"/></svg>
        <span th:text="#{nav.access}">교통안내</span>
      </a>
    </nav>

    <div style="flex:1;"></div>

    <div style="height:1px;background:var(--line);margin:16px 0 14px 0;"></div>
    <div class="admin-profile">
      <div class="avatar" th:text="#{adm.avatar}">관</div>
      <div>
        <div class="name" th:text="#{adm.admin}">관리자</div>
        <div class="mail" th:text="${admin.adminMail}">admin@seiryuan.jp</div>
      </div>
    </div>
  </aside>

  <!-- 메인 콘텐츠 -->
  <main class="admin-main">

    <div class="admin-head">
      <div class="crumb"><span th:text="#{adm.admin}">관리자</span> &nbsp;/&nbsp; <span th:text="#{adm.info}">정보등록</span> &nbsp;/&nbsp; <span th:text="#{nav.access}">교통안내</span></div>
      <h1 th:text="#{adm.ac_heading}">교통안내 수정</h1>
      <div class="rule"></div>
      <p th:text="#{adm.ac_desc}">공개 사이트의 교통안내 페이지에 표시되는 안내문을 수정합니다.</p>
    </div>

    <div th:if="${message}" class="form-card" style="padding-bottom:0;">
      <div class="answer-block">
        <div class="answer-body" th:text="#{${message}}"></div>
      </div>
    </div>

    <form class="form-card" th:action="@{/Admin/access_edit}" method="post">
      <div class="field">
        <label th:text="#{adm.ac_label}">교통안내 안내문</label>
        <textarea name="ryokanAccess" style="min-height:220px;"
                  th:placeholder="#{adm.ac_ph}"
                  th:text="${admin?.ryokanAccess}"></textarea>
      </div>
      <div class="form-actions" style="justify-content:flex-end;">
        <button type="submit" class="btn-gold" th:text="#{common.save}">저장</button>
      </div>
    </form>

  </main>
</div>

</body>
</html>
