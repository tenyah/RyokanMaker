<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'관리자 계정 신청 | ' + (${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵')">관리자 계정 신청 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='contact')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 관리자 계정 신청</div>
    <h1>관리자 계정 신청</h1>
    <div class="rule"></div>
    <p class="desc">
      료칸 운영을 위한 관리자 계정을 신청해주세요. 신청 내용을 확인한 뒤 승인되면
      입력하신 이메일로 아이디와 임시 비밀번호를 보내드립니다.
    </p>
  </section>

  <div th:if="${applySuccess}" class="form-card" style="padding-bottom:0;">
    <div class="answer-block">
      <div class="answer-label">신청 완료</div>
      <div class="answer-body">신청이 접수되었습니다. 승인 결과는 이메일로 안내드립니다.</div>
    </div>
  </div>

  <form class="form-card" th:action="@{/admin/apply}" method="post">

    <div class="form-row">
      <label class="field-label">료칸(업체) 이름</label>
      <input type="text" name="ryokanName" placeholder="예) 清流庵" required>
    </div>

    <div class="form-row">
      <label class="field-label">담당자 이름</label>
      <input type="text" name="applicantName" placeholder="담당자 성함" required>
    </div>

    <div class="form-row">
      <label class="field-label">이메일</label>
      <input type="text" name="applicantEmail" placeholder="계정 정보를 받으실 이메일" required>
    </div>

    <div class="form-row">
      <label class="field-label">연락처 (선택)</label>
      <input type="text" name="applicantTel" placeholder="010-0000-0000">
    </div>

    <div class="form-row">
      <label class="field-label">신청 내용 (선택)</label>
      <textarea name="requestMessage" rows="6" placeholder="료칸 소개, 문의사항 등을 자유롭게 남겨주세요"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-gold">신청하기</button>
    </div>
  </form>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
