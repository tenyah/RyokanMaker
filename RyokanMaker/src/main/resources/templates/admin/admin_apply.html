<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{adm.apply_title} + ' | ' + (${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵')">관리자 계정 신청 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='contact')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; <span th:text="#{adm.apply_title}">관리자 계정 신청</span></div>
    <h1 th:text="#{adm.apply_title}">관리자 계정 신청</h1>
    <div class="rule"></div>
    <p class="desc" th:text="#{adm.apply_desc}">료칸 운영을 위한 관리자 계정을 신청해주세요.</p>
  </section>

  <div th:if="${applySuccess}" class="form-card" style="padding-bottom:0;">
    <div class="answer-block">
      <div class="answer-label" th:text="#{adm.apply_done}">신청 완료</div>
      <div class="answer-body" th:text="#{adm.apply_done_desc}">신청이 접수되었습니다. 승인 결과는 이메일로 안내드립니다.</div>
    </div>
  </div>

  <form class="form-card" th:action="@{/admin/apply}" method="post">

    <div class="form-row">
      <label class="field-label" th:text="#{adm.apply_ryokan}">료칸(업체) 이름</label>
      <input type="text" name="ryokanName" th:placeholder="#{adm.apply_ryokan_ph}" required>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{adm.apply_name}">담당자 이름</label>
      <input type="text" name="applicantName" th:placeholder="#{adm.apply_name_ph}" required>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{member.email}">이메일</label>
      <input type="text" name="applicantEmail" th:placeholder="#{adm.apply_email_ph}" required>
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{adm.apply_tel}">연락처 (선택)</label>
      <input type="text" name="applicantTel" placeholder="010-0000-0000">
    </div>

    <div class="form-row">
      <label class="field-label" th:text="#{adm.apply_msg}">신청 내용 (선택)</label>
      <textarea name="requestMessage" rows="6" th:placeholder="#{adm.apply_msg_ph}"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-gold" th:text="#{adm.apply_submit}">신청하기</button>
    </div>
  </form>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
