<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清流庵 관리자 - 로그인</title>
<link rel="stylesheet" th:href="@{/css/common.css}"> 
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="10.5" width="15" height="10" rx="1"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.3" r="0.9" fill="currentColor" stroke="none"/>
    </symbol>
  </defs>
</svg>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="kanji">清流庵</div>
      <div class="romaji">OTARU FURUKAWA &nbsp;·&nbsp; ADMIN</div>
    </div>

    <div class="auth-title">관리자 로그인</div>
    <div class="auth-sub">발급받으신 관리자 아이디와 초기 비밀번호로<br>로그인해 주세요.</div>

    <!-- 실제 연동 시 method="post" th:action="@{/Admin/login}" 로 바꿔주세요 -->
    <form class="auth-form" action="/Admin/login" method="post">
      <div class="field">
        <label>아이디</label>
        <input type="text" name="adminId" placeholder="관리자 아이디를 입력하세요">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="adminPassword" placeholder="비밀번호를 입력하세요">
      </div>

      <button type="submit" class="btn-gold">로그인</button>
    </form>

    <div class="auth-footnote">
      아이디 · 초기 비밀번호를 아직 받지 못하셨다면<br>담당 개발팀으로 문의해 주세요.
    </div>
  </div>
</div>

</body>
</html>
