<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="(${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵') + ' 관리자 - 문의 관리'">清流庵 관리자 - 문의 관리</title>
<link rel="stylesheet" th:href="@{/css/common.css}"> 
</head>
<body>

<!-- 이 화면 본문 전용 아이콘 스프라이트 (헤더/사이드바 공통 아이콘은 admin_shell fragment가 제공) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20 20.5 12 4 4l2 7.5L4 20Z"/><path d="M6 11.5h6"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 5 5L19 7"/>
    </symbol>
  </defs>
</svg>
<div th:replace="~{admin/fragments/admin_shell :: admin_icons}"></div>

<div th:replace="~{admin/fragments/admin_shell :: admin_topbar(activePage='inquiry')}"></div>

<div class="admin-shell">

  <div th:replace="~{admin/fragments/admin_shell :: admin_sidebar(activePage='inquiry', showInfoSubmenu=false, showRequestsLink=false)}"></div>

  <!-- 메인 콘텐츠 -->
  <main class="admin-main">

    <div class="admin-head">
      <div class="crumb">관리자 &nbsp;/&nbsp; 문의 관리</div>
      <h1>문의 관리함</h1>
      <div class="rule"></div>
      <p>사이트 문의하기를 통해 접수된 고객 문의를 확인하고 답변합니다.</p>
    </div>

    <!-- 통계 타일 -->
    <div class="stat-grid cols-4" style="margin:0 56px 20px;">
      <div class="stat-tile"><div class="label">전체 문의</div><div class="value" th:text="${totalCount}">0</div></div>
      <div class="stat-tile accent-warn"><div class="label">미답변</div><div class="value" th:text="${pendingCount}">0</div></div>
      <div class="stat-tile accent-gold"><div class="label">답변완료</div><div class="value" th:text="${answeredCount}">0</div></div>
    </div>

    <!-- 필터 바 -->
    <div class="search-bar" style="margin:0 56px 18px;">
      <a class="search-field" th:href="@{/Admin/admin_inquiry}" style="text-decoration:none;">
        <div class="field-label">전체</div>
        <div class="field-value" th:style="${statusFilter == null} ? 'color:var(--gold-deep);font-weight:500;' : ''" th:text="${totalCount} + '건'">0건</div>
      </a>
      <a class="search-field" th:href="@{/Admin/admin_inquiry(status='답변대기')}" style="text-decoration:none;">
        <div class="field-label">미답변</div>
        <div class="field-value" th:style="${statusFilter == '답변대기'} ? 'color:var(--gold-deep);font-weight:500;' : ''" th:text="${pendingCount} + '건'">0건</div>
      </a>
      <a class="search-field" th:href="@{/Admin/admin_inquiry(status='답변완료')}" style="text-decoration:none;">
        <div class="field-label">답변완료</div>
        <div class="field-value" th:style="${statusFilter == '답변완료'} ? 'color:var(--gold-deep);font-weight:500;' : ''" th:text="${answeredCount} + '건'">0건</div>
      </a>
    </div>

    <div style="margin:0 56px;display:grid;grid-template-columns:1fr 1.35fr;gap:20px;">

      <!-- 문의 목록 -->
      <div class="form-card" style="padding:0;">
        <div style="padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">
          <span class="sub-label" style="margin:0;">문의 목록</span>
          <span style="font-size:11.5px;color:var(--ink-faint);" th:text="${#lists.size(inquiryList)} + '건'">0건</span>
        </div>

        <div class="img-hint" style="padding:16px 18px;" th:if="${#lists.isEmpty(inquiryList)}">접수된 문의가 없습니다.</div>

        <a th:each="inquiry : ${inquiryList}"
           th:href="@{/Admin/admin_inquiry(idx=${inquiry.inquiryIdx}, status=${statusFilter})}"
           style="text-decoration:none;color:inherit;display:block;"
           th:style="${selectedInquiry != null and selectedInquiry.inquiryIdx == inquiry.inquiryIdx} ? 'text-decoration:none;color:inherit;display:block;background:var(--gold-pale);' : 'text-decoration:none;color:inherit;display:block;'">
          <div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;"
               th:style="${inquiry.inquiryStatus == '답변완료'} ? 'padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;opacity:.65;' : 'padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;'">
            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <span style="font-family:var(--serif);font-size:14px;color:var(--ink);" th:text="${inquiry.userMail}">user@example.com</span>
                <span th:if="${inquiry.inquiryStatus == '답변완료'}" style="font-size:10.5px;font-weight:500;color:var(--gold-deep);background:var(--gold-pale);padding:3px 9px;flex:0 0 auto;">답변완료</span>
                <span th:unless="${inquiry.inquiryStatus == '답변완료'}" style="font-size:10.5px;font-weight:600;color:#fff;background:var(--warn);padding:3px 9px;flex:0 0 auto;">미답변</span>
              </div>
              <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${inquiry.inquiryTitle}">문의 제목</div>
              <div style="font-size:11px;color:var(--ink-faint);margin-top:6px;" th:text="${#temporals.format(inquiry.inquiryCreatedAt, 'yyyy.MM.dd HH:mm')}">2026.01.01 00:00</div>
            </div>
          </div>
        </a>
      </div>

      <!-- 상세 / 답변 -->
      <div class="form-card" th:if="${selectedInquiry != null}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-family:var(--serif);font-size:19px;color:var(--ink);" th:text="${selectedInquiry.inquiryTitle}">문의 제목</div>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">
              <span th:text="${selectedInquiry.userMail}">user@example.com</span> &nbsp;·&nbsp;
              <span th:text="${#temporals.format(selectedInquiry.inquiryCreatedAt, 'yyyy.MM.dd HH:mm')}">2026.01.01 00:00</span> 접수
            </div>
          </div>
          <span th:if="${selectedInquiry.inquiryStatus == '답변완료'}" style="font-size:10.5px;font-weight:500;color:var(--gold-deep);background:var(--gold-pale);padding:4px 11px;flex:0 0 auto;">답변완료</span>
          <span th:unless="${selectedInquiry.inquiryStatus == '답변완료'}" style="font-size:10.5px;font-weight:600;color:#fff;background:var(--warn);padding:4px 11px;flex:0 0 auto;">미답변</span>
        </div>

        <div class="divider"></div>

        <div style="background:var(--bg-soft);padding:18px 20px;font-size:13.5px;line-height:1.85;color:var(--ink);" th:text="${selectedInquiry.inquiryContent}">
          문의 내용
        </div>

        <div class="answer-block" th:if="${selectedInquiry.inquiryAnswerContent != null}" style="margin-top:16px;padding:18px 20px;background:var(--gold-pale);font-size:13.5px;line-height:1.85;color:var(--ink);">
          <div style="font-size:11.5px;font-weight:500;color:var(--gold-deep);margin-bottom:8px;">등록된 답변</div>
          <div th:text="${selectedInquiry.inquiryAnswerContent}">답변 내용</div>
        </div>

        <form th:action="@{/Admin/inquiry_answer}" method="post">
          <input type="hidden" name="inquiryIdx" th:value="${selectedInquiry.inquiryIdx}">
          <div class="field" style="margin-top:20px;">
            <label th:text="${selectedInquiry.inquiryAnswerContent != null} ? '답변 수정' : '답변 작성'">답변 작성</label>
            <textarea name="inquiryAnswerContent" style="min-height:130px;" placeholder="답변 내용을 입력하세요..." required th:text="${selectedInquiry.inquiryAnswerContent}"></textarea>
          </div>

          <div style="display:flex;justify-content:flex-end;align-items:center;margin-top:16px;">
            <button type="submit" class="btn-gold" style="padding:11px 22px;font-size:12.5px;"><svg width="14" height="14"><use href="#i-send"/></svg>&nbsp;<span th:text="${selectedInquiry.inquiryAnswerContent != null} ? '답변 수정' : '답변 등록'">답변 등록</span></button>
          </div>
        </form>
      </div>

      <div class="form-card" th:if="${selectedInquiry == null}">
        <div class="img-hint">왼쪽에서 문의를 선택해 주세요.</div>
      </div>

    </div>

    <div style="height:56px;"></div>

  </main>
</div>

<script>
document.addEventListener('click', function (e) {
  document.querySelectorAll('.account-menu.open').forEach(function (menu) {
    if (!menu.contains(e.target)) menu.classList.remove('open');
  });
});
</script>
</body>
</html>
