<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>header fragment</title></head>
<body>

<!--
  공통 헤더 조각(fragment)입니다.
  사용하는 페이지에서는 아래처럼 activePage 파라미터로 현재 메뉴를 넘겨주면
  해당 메뉴에 active 스타일이 자동으로 적용됩니다.

  <div th:replace="~{fragments/header :: header(activePage='booking')}"></div>

  activePage 값 : rooms / onsen / dining / facility / access / contact / booking
-->
<header class="site-header" th:fragment="header(activePage)">
  <a href="/" class="logo" style="text-decoration:none;">
    <span class="kanji">清流庵</span>
    <span class="romaji">OTARU FURUKAWA</span>
  </a>
  <nav>
    <a class="navlink" th:classappend="${activePage == 'rooms'} ? 'active' : ''" th:href="@{/rooms}" th:text="#{nav.rooms}">객실</a>
    <a class="navlink" th:classappend="${activePage == 'onsen'} ? 'active' : ''" th:href="@{/onsen}" th:text="#{nav.onsen}">온천</a>
    <a class="navlink" th:classappend="${activePage == 'dining'} ? 'active' : ''" th:href="@{/dining}" th:text="#{nav.dining}">식사</a>
    <a class="navlink" th:classappend="${activePage == 'facility'} ? 'active' : ''" th:href="@{/facility}" th:text="#{nav.facility}">시설</a>
    <a class="navlink" th:classappend="${activePage == 'access'} ? 'active' : ''" th:href="@{/access}" th:text="#{nav.access}">교통안내</a>
    <a class="navlink" th:classappend="${activePage == 'contact'} ? 'active' : ''" th:href="@{/inquiry/list}" th:text="#{nav.contact}">문의하기</a>
    <th:block th:if="${loginMember == null}">
      <a class="navlink" th:classappend="${activePage == 'login'} ? 'active' : ''" th:href="@{/member/login}" th:text="#{nav.login}">로그인</a>
      <a class="navlink" th:classappend="${activePage == 'signup'} ? 'active' : ''" th:href="@{/member/signup}" th:text="#{nav.signup}">회원가입</a>
    </th:block>
    <th:block th:unless="${loginMember == null}">
      <a class="navlink" th:classappend="${activePage == 'mypage'} ? 'active' : ''" th:href="@{/member/mypage}"
         th:text="#{nav.greeting(${loginMember.userNickname})}"></a>
      <a class="navlink" th:href="@{/member/logout}" th:text="#{nav.logout}">로그아웃</a>
    </th:block>
    <span class="navlink" style="display:inline-flex; gap:8px;">
      <a href="?lang=ko" style="font-size:12px;">KO</a>
      <a href="?lang=en" style="font-size:12px;">EN</a>
      <a href="?lang=ja" style="font-size:12px;">JA</a>
    </span>
    <a class="btn-gold" style="padding:11px 28px; font-size:13px; text-decoration:none;" th:href="@{/reservation/plan}" th:text="#{nav.booking}">숙박예약</a>
  </nav>
</header>

</body>
</html>
