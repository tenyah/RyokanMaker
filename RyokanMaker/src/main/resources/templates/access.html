<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{nav.access} + ' | ' + (${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵')">교통안내 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .access-map { padding: 32px 56px 0; display: flex; justify-content: center; }
    .access-map svg { max-width: 420px; width: 100%; height: auto; }
    .access-text { max-width: 640px; margin: 0 auto; padding: 32px 56px 0; }
    .access-text p { font-size: 14px; color: var(--ink-soft); line-height: 2; white-space: pre-line; margin: 0; }

    .access-options {
      max-width: 720px; margin: 0 auto; padding: 40px 56px 64px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    }
    .access-option { border: 1px solid var(--line); background: var(--paper); padding: 24px 20px; display: flex; flex-direction: column; gap: 10px; }
    .access-option .icon {
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      color: var(--gold-deep); border: 1px solid var(--gold-pale); background: var(--gold-pale); border-radius: 50%;
    }
    .access-option h3 { font-family: var(--serif); font-weight: 400; font-size: 16px; color: var(--ink); margin: 0; }
    .access-option p { font-size: 13px; font-weight: 300; line-height: 1.8; color: var(--ink-soft); margin: 0; white-space: pre-line; }
    .access-option .fare { font-size: 12px; color: var(--gold-deep); }

    @media (max-width: 720px) {
      .access-options { grid-template-columns: 1fr; padding: 32px 24px 48px; }
    }
  </style>
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='access')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; <span th:text="#{nav.access}">교통안내</span></div>
    <h1 th:text="#{nav.access}">교통안내</h1>
    <div class="rule"></div>
    <p class="desc" th:text="${@pt.t('ACCESS_DESC')}">오타루역에서 清流庵까지 오시는 길을 안내해드립니다.</p>
  </section>

  <div class="access-map">
    <svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
      <line x1="60" y1="150" x2="580" y2="150" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

      <!-- JR 오타루역 : 지도 마커 핀 -->
      <g>
        <path d="M60 150 C60 150 38 118 38 98 a22 22 0 1 1 44 0 C82 118 60 150 60 150 Z"
              fill="var(--gold-pale)" stroke="var(--gold-deep)" stroke-width="2"/>
        <circle cx="60" cy="98" r="8" fill="var(--gold-deep)"/>
        <text x="60" y="78" text-anchor="middle" font-family="var(--serif)" font-size="15" fill="var(--ink)" th:text="${@pt.t('ACCESS_STATION')}">JR 오타루역</text>
        <text x="60" y="185" text-anchor="middle" font-size="12" fill="var(--ink-faint)">START</text>
      </g>

      <!-- 순환버스 정류장 : 버스 아이콘 -->
      <g>
        <circle cx="320" cy="150" r="18" fill="var(--bg-soft)" stroke="var(--gold-deep)" stroke-width="2"/>
        <g transform="translate(308,138)" stroke="var(--gold-deep)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="24" height="16" rx="2.5"/>
          <path d="M0 11h24"/>
          <circle cx="6" cy="16" r="2" fill="var(--gold-deep)" stroke="none"/>
          <circle cx="18" cy="16" r="2" fill="var(--gold-deep)" stroke="none"/>
        </g>
        <text x="320" y="112" text-anchor="middle" font-size="12" fill="var(--ink-soft)" th:text="${@pt.t('ACCESS_BUSSTOP')}">순환버스 정류장</text>
        <text x="320" y="185" text-anchor="middle" font-size="11" fill="var(--ink-faint)" th:text="${@pt.t('ACCESS_BUSSTOP_SUB')}">'후루카와' 하차</text>
      </g>

      <!-- 清流庵 : 지도 마커 핀 (골드 강조) -->
      <g>
        <path d="M580 150 C580 150 558 118 558 98 a22 22 0 1 1 44 0 C602 118 580 150 580 150 Z"
              fill="var(--gold)" stroke="var(--gold-deep)" stroke-width="2"/>
        <circle cx="580" cy="98" r="8" fill="#fff"/>
        <text x="580" y="78" text-anchor="middle" font-family="var(--serif)" font-size="16" fill="var(--gold-deep)">清流庵</text>
        <text x="580" y="185" text-anchor="middle" font-size="12" fill="var(--ink-faint)">GOAL</text>
      </g>
    </svg>
  </div>

  <div class="access-text">
    <p th:text="${admin?.ryokanAccess} ? ${@tr.t(admin.ryokanAccess)} : #{access.empty}">JR 오타루역에서 도보 15분, 또는 역 앞 순환버스 이용 후 '후루카와' 정류장 하차.</p>
  </div>

  <div class="access-options">
    <div class="access-option">
      <div class="icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="4.5" r="2"/><path d="m8 20 3-6-2-4 2-3 3 3 3-1 1 3-3.5 1.5L16 20"/>
        </svg>
      </div>
      <h3 th:text="#{access.walk}">도보</h3>
      <p th:text="${@pt.t('ACCESS_WALK_DESC')}">JR 오타루역 정면 출구에서
도보 약 15분 (약 1.1km)</p>
    </div>

    <div class="access-option">
      <div class="icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="12.5" rx="2"/><path d="M4 12h16"/><circle cx="8" cy="19" r="1.6" fill="currentColor" stroke="none"/><circle cx="16" cy="19" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h3 th:text="#{access.bus}">버스</h3>
      <p th:text="${@pt.t('ACCESS_BUS_DESC')}">오타루역앞 3번 승강장에서
순환버스(덴구야마 방면) 탑승
'후루카와' 정류장 하차 후 도보 3분</p>
      <div class="fare" th:text="${@pt.t('ACCESS_BUS_FARE')}">약 10분 · 요금 210엔</div>
    </div>

    <div class="access-option">
      <div class="icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16.5 5.5 11a2 2 0 0 1 2-1.5h9a2 2 0 0 1 2 1.5l1.5 5.5"/><rect x="3" y="16.5" width="18" height="4" rx="1.5"/><circle cx="7.5" cy="18.5" r="1"/><circle cx="16.5" cy="18.5" r="1"/>
        </svg>
      </div>
      <h3 th:text="#{access.taxi}">택시</h3>
      <p th:text="${@pt.t('ACCESS_TAXI_DESC')}">오타루역 택시승강장에서 탑승
소요시간 약 10분</p>
      <div class="fare" th:text="${@pt.t('ACCESS_TAXI_FARE')}">예상 요금 1,500 ~ 1,800엔</div>
    </div>
  </div>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
