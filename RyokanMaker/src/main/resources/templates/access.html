<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>교통안내 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <style>
    .access-map { padding: 48px 56px 0; display: flex; justify-content: center; }
    .access-map svg { max-width: 640px; width: 100%; height: auto; }
    .access-text { max-width: 640px; margin: 0 auto; padding: 32px 56px 64px; }
    .access-text p { font-size: 14px; color: var(--ink-soft); line-height: 2; white-space: pre-line; margin: 0; }
  </style>
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='access')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 교통안내</div>
    <h1>교통안내</h1>
    <div class="rule"></div>
    <p class="desc">오타루역에서 清流庵까지 오시는 길을 안내해드립니다.</p>
  </section>

  <div class="access-map">
    <svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
      <line x1="60" y1="140" x2="580" y2="140" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>

      <circle cx="60" cy="140" r="10" fill="var(--gold-pale)" stroke="var(--gold-deep)" stroke-width="2"/>
      <text x="60" y="100" text-anchor="middle" font-family="var(--serif)" font-size="15" fill="var(--ink)">JR 오타루역</text>
      <text x="60" y="175" text-anchor="middle" font-size="12" fill="var(--ink-faint)">START</text>

      <rect x="300" y="128" width="24" height="24" rx="3" fill="none" stroke="var(--gold-deep)" stroke-width="2"/>
      <path d="M306 140 h12 M312 134 v12" stroke="var(--gold-deep)" stroke-width="2"/>
      <text x="312" y="100" text-anchor="middle" font-size="12" fill="var(--ink-soft)">순환버스 정류장</text>

      <path d="M580 140 l-14 -14 h28 z M580 140 l-14 14 h28 z" fill="var(--gold)"/>
      <circle cx="580" cy="140" r="16" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <text x="580" y="100" text-anchor="middle" font-family="var(--serif)" font-size="16" fill="var(--gold-deep)">清流庵</text>
      <text x="580" y="175" text-anchor="middle" font-size="12" fill="var(--ink-faint)">GOAL</text>
    </svg>
  </div>

  <div class="access-text">
    <p th:text="${admin?.ryokanAccess} ?: '교통안내 정보가 아직 등록되지 않았습니다.'">JR 오타루역에서 도보 15분, 또는 역 앞 순환버스 이용 후 '후루카와' 정류장 하차.</p>
  </div>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
