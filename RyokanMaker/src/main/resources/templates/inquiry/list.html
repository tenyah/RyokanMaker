<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>1:1 문의 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='contact')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 문의하기 &nbsp;/&nbsp; 1:1 문의</div>
    <h1>1:1 문의</h1>
    <div class="rule"></div>
    <p class="desc">그동안 남겨주신 문의와 답변 내역입니다.</p>
  </section>

  <div class="list-toolbar">
    <a class="btn-gold" style="text-decoration:none;" th:href="@{/inquiry/write}">문의 작성</a>
  </div>

  <section class="qna-table">
    <table>
      <thead>
        <tr>
          <th style="width:60%;">제목</th>
          <th style="text-align:center;">상태</th>
          <th style="text-align:right;">등록일</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="inquiry : ${inquiryList}">
          <td>
            <a class="qna-title-link" th:href="@{/inquiry/view(idx=${inquiry.inquiryIdx})}"
               th:text="${inquiry.inquiryTitle}">문의 제목</a>
          </td>
          <td class="qna-status">
            <span class="status-pill" th:classappend="${inquiry.inquiryStatus == '답변완료'} ? 'done' : 'wait'"
                  th:text="${inquiry.inquiryStatus}">답변대기</span>
          </td>
          <td class="qna-date" th:text="${#temporals.format(inquiry.inquiryCreatedAt, 'yyyy.MM.dd')}">2026.01.01</td>
        </tr>
      </tbody>
    </table>

    <div class="qna-empty" th:if="${#lists.isEmpty(inquiryList)}">
      문의하신 내역이 없습니다.
    </div>
  </section>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
