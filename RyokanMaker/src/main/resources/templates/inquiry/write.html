<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'문의 작성 | ' + (${!#strings.isEmpty(siteInfo?.ryokanName)} ? ${siteInfo.ryokanName} : '清流庵')">문의 작성 | 清流庵 오타루 후루카와</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="page-wrap">

  <div th:replace="~{include/header :: header(activePage='contact')}"></div>

  <section class="page-title">
    <div class="crumb">HOME &nbsp;/&nbsp; 문의하기 &nbsp;/&nbsp; 문의 작성</div>
    <h1>문의 작성</h1>
    <div class="rule"></div>
    <p class="desc">궁금하신 점을 남겨주시면 확인 후 답변드리겠습니다.</p>
  </section>

  <form class="form-card" th:action="@{/inquiry/write}" method="post">
    <input type="hidden" name="adminIdx" th:value="${adminIdx}">

    <div class="form-row">
      <label class="field-label">제목</label>
      <input type="text" name="inquiryTitle" placeholder="문의 제목을 입력해주세요" required>
    </div>

    <div class="form-row">
      <label class="field-label">내용</label>
      <textarea name="inquiryContent" rows="10" placeholder="문의하실 내용을 입력해주세요" required></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-gold">문의 등록</button>
      <a class="btn-line" th:href="@{/inquiry/list}">취소</a>
    </div>
  </form>

  <div th:replace="~{include/footer :: footer}"></div>

</div>

</body>
</html>
